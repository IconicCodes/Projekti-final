
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Your Car | LEDRI MOTORS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">LEDRI<span> MOTORS.</span></a>
    <nav>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse Cars</a>
        <a href="favorites.html">Favorites</a>
        <a href="sell.html" class="active">Sell Your Car</a>
    </nav>
    <a href="browse.html" class="nav-button">Explore Cars ↗</a>
</header>

<main class="browse-page">

    <section class="browse-header">
        <span class="eyebrow">LIST YOUR VEHICLE</span>
        <h1>Sell Your Car.</h1>
        <p>Provide your vehicle details to create a new listing.</p>
    </section>

    <form id="sellForm" class="sell-form">

        <h2>Vehicle Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label for="brand">Brand</label>
                <select id="brand" required>
                    <option value="">Select Brand</option>
                    <option>Mercedes-Benz</option>
                    <option>BMW</option>
                    <option>Audi</option>
                    <option>Volkswagen</option>
                    <option>Porsche</option>
                    <option>Toyota</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <input id="model" type="text" placeholder="e.g. E350 AMG Line" required>
            </div>

            <div class="form-group">
                <label for="year">Production Year</label>
                <input id="year" type="number" min="1900" max="2026" required>
            </div>

            <div class="form-group">
                <label for="price">Price (€)</label>
                <input id="price" type="number" min="1" required>
            </div>

            <div class="form-group">
                <label for="mileage">Mileage (km)</label>
                <input id="mileage" type="number" min="0" required>
            </div>

            <div class="form-group">
                <label for="fuel">Fuel Type</label>
                <select id="fuel" required>
                    <option value="">Select Fuel</option>
                    <option>Diesel</option>
                    <option>Petrol</option>
                    <option>Hybrid</option>
                    <option>Electric</option>
                </select>
            </div>

            <div class="form-group">
                <label for="transmission">Transmission</label>
                <select id="transmission" required>
                    <option value="">Select Transmission</option>
                    <option>Automatic</option>
                    <option>Manual</option>
                </select>
            </div>

            <div class="form-group">
                <label for="engine">Engine Size</label>
                <input id="engine" type="text" placeholder="e.g. 3.0L" required>
            </div>

            <div class="form-group">
                <label for="horsepower">Horsepower</label>
                <input id="horsepower" type="number" min="1" required>
            </div>

            <div class="form-group">
                <label for="body">Body Type</label>
                <select id="body" required>
                    <option value="">Select Body Type</option>
                    <option>Sedan</option>
                    <option>SUV</option>
                    <option>Coupe</option>
                    <option>Hatchback</option>
                    <option>Wagon</option>
                </select>
            </div>

            <div class="form-group">
                <label for="color">Exterior Color</label>
                <input id="color" type="text" placeholder="e.g. Black" required>
            </div>

            <div class="form-group">
                <label for="image">Vehicle Image URL</label>
                <input id="image" type="url" placeholder="https://example.com/car.jpg" required>
            </div>

        </div>

        <div class="form-group">
            <label for="description">Vehicle Description</label>
            <textarea id="description" rows="5" placeholder="Describe your vehicle..." required></textarea>
        </div>

        <h2>Seller Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label for="seller">Seller Name</label>
                <input id="seller" type="text" required>
            </div>

            <div class="form-group">
                <label for="contact">Contact Information</label>
                <input id="contact" type="text" required>
            </div>

        </div>

        <button type="submit" class="primary-button">
            Publish Vehicle Listing ↗
        </button>

        <p id="formMessage"></p>

    </form>

</main>

<footer>
    <a href="index.html" class="logo">LEDRI<span> MOTORS.</span></a>
    <p>Find Your Next Drive.</p>
    <p>© 2026 LEDRI MOTORS. All rights reserved.</p>
</footer>

<script src="js/animations.js"></script>
<script src="js/data.js"></script>
<script src="js/sell.js"></script>

</body>
</html>
